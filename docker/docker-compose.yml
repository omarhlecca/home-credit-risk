version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  env_file:
    - ../.env
  environment:
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  volumes:
    - ../dags:/opt/airflow/dags
    - ../data:/opt/airflow/data
    - ../src:/opt/airflow/src
    - airflow-logs:/opt/airflow/logs
  depends_on:
    mysql:
      condition: service_healthy
  networks:
    - hc-network

services:

  # ── MySQL 8 ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: hc-mysql
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hc-network

  # ── Airflow Init ─────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: hc-airflow-init
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --password admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@homecredit.local
      "
    restart: on-failure

  # ── Airflow Webserver ─────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: hc-airflow-webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Airflow Scheduler ─────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: hc-airflow-scheduler
    command: airflow scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── MLflow ───────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: hc-mlflow
    restart: unless-stopped
    env_file:
      - ../.env
    command: >
      bash -c "
        pip install mlflow pymysql -q &&
        mlflow server
          --backend-store-uri ${MLFLOW_BACKEND_STORE_URI}
          --default-artifact-root /mlflow-artifacts
          --host 0.0.0.0
          --port 5000
      "
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow-artifacts
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hc-network

# ── Volúmenes persistentes ────────────────────────────
volumes:
  mysql-data:
    driver: local
  airflow-logs:
    driver: local
  mlflow-artifacts:
    driver: local

# ── Red interna ───────────────────────────────────────
networks:
  hc-network:
    driver: bridge